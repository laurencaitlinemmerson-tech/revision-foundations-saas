<svg width="1400" height="980" viewBox="0 0 1400 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="980" fill="#FAFAF8"/>
  <rect x="0" y="0" width="1400" height="72" fill="#FAFAF8"/>
  <line x1="0" y1="72.5" x2="1400" y2="72.5" stroke="rgba(0,0,0,0.08)"/>
  <text x="96" y="43" fill="#1A1815" font-family="Georgia, serif" font-size="26">The Nurse Lab</text>

  <text x="120" y="180" fill="#9C8878" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2.2">CHILDREN'S NURSING REVISION</text>
  <text x="120" y="274" fill="#1A1815" font-family="Georgia, serif" font-size="74">Structured revision</text>
  <text x="120" y="354" fill="#1A1815" font-family="Georgia, serif" font-size="74">tools for nursing</text>
  <text x="120" y="434" fill="#1A1815" font-family="Georgia, serif" font-size="74">students</text>
  <text x="120" y="496" fill="#5A5750" font-family="Inter, Arial, sans-serif" font-size="28">Keep the homepage editorial, but prove the product with</text>
  <text x="120" y="536" fill="#5A5750" font-family="Inter, Arial, sans-serif" font-size="28">one real content crop instead of a decorative image.</text>

  <rect x="120" y="588" width="196" height="52" rx="26" fill="#1A1815"/>
  <text x="158" y="621" fill="#FAFAF8" font-family="Inter, Arial, sans-serif" font-size="18">Explore the bundle</text>
  <rect x="332" y="588" width="184" height="52" rx="26" fill="transparent" stroke="rgba(0,0,0,0.10)"/>
  <text x="389" y="621" fill="#1A1815" font-family="Inter, Arial, sans-serif" font-size="18">Open the hub</text>

  <rect x="850" y="156" width="430" height="662" rx="34" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)"/>
  <text x="886" y="206" fill="#9C8878" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="2">REAL CONTENT PREVIEW</text>
  <text x="886" y="262" fill="#1A1815" font-family="Georgia, serif" font-size="48">A–E Assessment</text>
  <text x="886" y="314" fill="#1A1815" font-family="Georgia, serif" font-size="48">Framework</text>
  <text x="886" y="356" fill="#5A5750" font-family="Inter, Arial, sans-serif" font-size="24">Show a genuine guide crop, not a sales graphic.</text>

  <line x1="886" y1="398.5" x2="1244" y2="398.5" stroke="rgba(0,0,0,0.08)"/>
  <text x="886" y="446" fill="#2E67B1" font-family="Georgia, serif" font-size="72" font-style="italic">A</text>
  <rect x="888" y="460" width="88" height="26" rx="6" fill="#E6EEF8"/>
  <text x="913" y="478" fill="#2E67B1" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="1.6">AIRWAY</text>
  <text x="1040" y="446" fill="#1A1815" font-family="Georgia, serif" font-size="34">Airway</text>
  <text x="1040" y="476" fill="#9C8878" font-family="Georgia, serif" font-size="18" font-style="italic">Is the airway open and protected?</text>
  <rect x="1040" y="504" width="190" height="180" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)"/>
  <rect x="1230" y="504" width="20" height="180" fill="#FFFFFF"/>
  <text x="1060" y="530" fill="#999999" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing="1.8">LOOK</text>
  <line x1="1060" y1="540.5" x2="1212" y2="540.5" stroke="rgba(0,0,0,0.08)"/>
  <text x="1060" y="572" fill="#5A5750" font-family="Inter, Arial, sans-serif" font-size="16">– Visible obstruction</text>
  <text x="1060" y="604" fill="#5A5750" font-family="Inter, Arial, sans-serif" font-size="16">– Lip or tongue swelling</text>
  <text x="1060" y="636" fill="#5A5750" font-family="Inter, Arial, sans-serif" font-size="16">– Cyanosis</text>
  <rect x="886" y="718" width="322" height="64" fill="#FAEEDA"/>
  <text x="910" y="742" fill="#633806" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="1.8">CLINICAL PEARL</text>
  <text x="910" y="770" fill="#633806" font-family="Inter, Arial, sans-serif" font-size="18">Mild swelling can matter fast in children.</text>

  <rect x="1120" y="98" width="160" height="40" rx="20" fill="#E6EEF8"/>
  <text x="1152" y="124" fill="#2E67B1" font-family="Inter, Arial, sans-serif" font-size="14">Recommended</text>
</svg>
